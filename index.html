<!doctype html>
<html lang="zh-Hans" data-type="software">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="page-type" content="software">
<meta name="site-kind" content="software">
<meta name="theme-color" content="#f4f1fc">
<meta name="description" content="按分组浏览插画例图与英文绘图提示词。">
<title>雾页 · 提示词图鉴</title>
<link rel="stylesheet" href="./style.css">
<script defer src="./catalog.js"></script>
<script defer src="./lib/clean-image.js"></script>
<script defer src="./app.js"></script>
</head>
<body>
<div class="shell">
<header class="mast"><a class="brand" href="#" aria-label="雾页首页"><span aria-hidden="true">✴︎</span> 雾页<span class="brand-en" aria-hidden="true">MIST INDEX</span></a><a href="#browse" class="top-link">浏览图鉴 <span aria-hidden="true">↗</span></a></header>
<main>
<section class="intro" id="browse" data-enter>
<div class="intro-copy">
<p class="overline" aria-hidden="true">ILLUSTRATION PROMPTS</p>
<h1>提示词图鉴<span aria-hidden="true">.</span></h1>
<p id="subtitle">从例图出发，找一组想试的提示词。</p>
</div>
<div class="hero-art" aria-hidden="true"></div>
</section>
<section aria-label="图鉴目录" class="directory">
<div class="section-head">
<div><a href="#" id="back" hidden>← 返回分组</a><h2 id="section-title" tabindex="-1">提示词分组</h2></div>
<span id="count"></span>
</div>
<div id="cards" class="grid"></div>
</section>
</main>
<footer>雾页 <span aria-hidden="true">✦</span> 提示词图鉴</footer>
</div>
<dialog id="detail" aria-labelledby="detail-title">
<div class="detail-layout">
<div class="detail-art"><img id="detail-image" alt=""></div>
<div class="detail-copy">
<button class="close" id="close" type="button" aria-label="关闭详情">×</button>
<div class="detail-head"><p id="detail-group" class="overline"></p><h2 id="detail-title"></h2><p class="sample" id="detail-sample" hidden>演示例图 · 非 NovelAI 实测出图</p></div>
<section class="prompt-block"><div class="prompt-head"><h3>正面提示词</h3><button class="copy" type="button" id="copy-positive">复制</button></div><pre id="positive"></pre></section>
<section class="prompt-block" id="negative-block" hidden><div class="prompt-head"><h3>负面提示词</h3><button class="copy" type="button" id="copy-negative">复制</button></div><pre id="negative"></pre></section>
<button type="button" id="download" class="download"><span aria-hidden="true">↓</span> 下载净化 PNG</button>
<p class="hint" id="status" role="status">自动清除 NovelAI 元数据。</p>
</div>
</div>
</dialog>
</body>
</html>
